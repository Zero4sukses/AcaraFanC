name: Sync FanC Live Schedules

on:
  schedule:
    # Berjalan otomatis setiap 30 menit sekali
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests Pillow

      - name: Run FanC Parser & Image Generator
        run: |
          python FanC.py

      - name: Commit & Push M3U and Schedule Image
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@actions.github.com"
          git add FanClangsung.m3u jadwal_fanc.png
          git commit -m "Auto-update FanClangsung.m3u & jadwal_fanc.png [skip ci]" || exit 0
          git push
